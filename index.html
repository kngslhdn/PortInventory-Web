<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch Port Inventory</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--nav:#252b33;--text:#263238;--muted:#68737d;--line:#d9dee3;--cyan:#53b9d7;--green:#35c759;--red:#ff4d4f;--gray:#9aa1a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,Helvetica,sans-serif;color:var(--text)}
.top{height:62px;background:#252b33;color:#fff;display:flex;align-items:center;padding:0 22px;gap:20px}
.logo{font-size:20px;font-weight:700}.nav{display:flex;gap:20px;color:#e8edf1;font-size:13px}.nav span{opacity:.9}
.wrap{padding:12px 14px 30px}.crumb{font-size:14px;font-weight:600;margin-bottom:10px}
.toolbar{background:#fff;border:1px solid #d8dde2;border-radius:3px;padding:12px 14px;display:flex;align-items:center;gap:12px}
label{font-weight:600}.select{min-width:390px;padding:8px 10px;border:1px solid #bbb;border-radius:3px;background:#fff}
.banner{margin-top:10px;background:var(--cyan);color:#fff;border-radius:4px;padding:12px 14px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin:16px 0}
.card{background:#20252b;border:1px solid #394049;color:#fff;text-align:center;padding:10px;border-radius:3px}
.num{font-size:22px;font-weight:700}.lbl{font-size:12px;margin-top:2px}
.search{width:100%;padding:9px 12px;border:1px solid #cbd1d6;border-radius:3px;margin-bottom:0}
.table-wrap{background:#fff;border:1px solid #d6dbe0;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}thead{background:#2b3138;color:#fff}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #e1e5e8}th{font-weight:600;font-size:13px}tbody tr:hover{background:#f5f9fb}
.badge{display:inline-block;padding:3px 7px;border-radius:4px;color:#fff;font-size:11px;font-weight:700}.up{background:var(--green)}.down{background:var(--red)}.disabled{background:var(--gray)}
.footer{padding:16px 0;color:var(--muted);font-size:12px}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.select{min-width:0;flex:1}.toolbar{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top"><div class="logo">LibreNMS</div><nav class="nav"><span>Overview</span><span>Devices</span><span>Maps</span><span>Ports</span><span>Health</span><span>Wireless</span><span>Services</span><span>Routing</span><span>Alerts</span></nav></header>
<main class="wrap">
<div class="crumb">☰ Switch Port Inventory</div>
<div class="toolbar"><label for="switch">Switch:</label><select id="switch" class="select"></select></div>
<div id="banner" class="banner">▤ Loading PortInventory...</div>
<div class="cards">
<div class="card"><div id="total" class="num">0</div><div class="lbl">Total Ports</div></div>
<div class="card"><div id="up" class="num">0</div><div class="lbl">UP</div></div>
<div class="card"><div id="down" class="num">0</div><div class="lbl">DOWN</div></div>
<div class="card"><div id="disabled" class="num">0</div><div class="lbl">Disabled</div></div>
</div>
<input id="search" class="search" placeholder="Search port, description, alias, status...">
<div class="table-wrap"><table><thead><tr><th>Port</th><th>Status</th><th>Admin</th><th>Description</th><th>Alias</th><th>Speed</th><th>Type</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="footer">PortInventory Web • Data source: LibreNMS NMS • Web presentation via GitHub Pages</div>
</main>
<script>
const demo={devices:[{device_id:63,hostname:"REDACTED-IP",sysName:"KIJKT1-6300M-24G-INT-02"}],device:{device_id:63,hostname:"REDACTED-IP",sysName:"KIJKT1-6300M-24G-INT-02"},ports:[
{ifName:"1/1/1",ifOperStatus:"up",ifAdminStatus:"up",ifDescr:"1/1/1",ifAlias:"to KIJT1-C2960-48TTI-ALG-01",ifSpeed:1000000000,ifType:"ethernetCsmacd"},
{ifName:"1/1/2",ifOperStatus:"up",ifAdminStatus:"up",ifDescr:"1/1/2",ifAlias:"to KIJT1-C2960-48TTI-BLG-02",ifSpeed:1000000000,ifType:"ethernetCsmacd"},
{ifName:"1/1/3",ifOperStatus:"up",ifAdminStatus:"up",ifDescr:"1/1/3",ifAlias:"to KIJT1-C2960-24PCL-CLG-03",ifSpeed:1000000000,ifType:"ethernetCsmacd"},
{ifName:"1/1/4",ifOperStatus:"down",ifAdminStatus:"up",ifDescr:"1/1/4",ifAlias:"1/1/4",ifSpeed:0,ifType:"ethernetCsmacd"},
{ifName:"1/1/5",ifOperStatus:"down",ifAdminStatus:"up",ifDescr:"1/1/5",ifAlias:"1/1/5",ifSpeed:0,ifType:"ethernetCsmacd"},
{ifName:"1/1/6",ifOperStatus:"down",ifAdminStatus:"up",ifDescr:"1/1/6",ifAlias:"1/1/6",ifSpeed:0,ifType:"ethernetCsmacd"},
{ifName:"1/1/10",ifOperStatus:"up",ifAdminStatus:"up",ifDescr:"1/1/10",ifAlias:"to OXI 01",ifSpeed:1000000000,ifType:"ethernetCsmacd"}]};
const $=id=>document.getElementById(id);
function speed(v){return v>=1000000000?(v/1000000000).toLocaleString()+" Gbps":v?Math.round(v/1000000)+" Mbps":"-"}
function render(d){const dev=d.device||d.devices?.[0]; $("banner").textContent="▤ "+(dev?.sysName||dev?.hostname||"Switch Port Inventory")+" — "+(dev?.hostname||""); const sel=$("switch"); if(!sel.options.length)(d.devices||[dev]).forEach(x=>{const o=document.createElement("option");o.value=x.device_id;o.textContent=(x.sysName||x.hostname)+" ("+x.hostname+")";sel.appendChild(o)}); const ports=d.ports||[]; $("total").textContent=ports.length;$("up").textContent=ports.filter(x=>String(x.ifOperStatus).toLowerCase()==="up").length;$("down").textContent=ports.filter(x=>String(x.ifOperStatus).toLowerCase()==="down").length;$("disabled").textContent=ports.filter(x=>String(x.ifAdminStatus).toLowerCase()==="down").length; drawRows(ports)}
function drawRows(ports){const q=$("search").value.toLowerCase();$("rows").innerHTML=ports.filter(p=>Object.values(p).join(" ").toLowerCase().includes(q)).map(p=>{const st=String(p.ifOperStatus).toLowerCase(),ad=String(p.ifAdminStatus).toLowerCase();return "<tr><td>"+(p.ifName||"-")+"</td><td><span class='badge "+(st==="up"?"up":"down")+"'>"+st.toUpperCase()+"</span></td><td><span class='badge "+(ad==="up"?"up":"disabled")+"'>"+ad.toUpperCase()+"</span></td><td>"+(p.ifDescr||"-")+"</td><td>"+(p.ifAlias||"-")+"</td><td>"+speed(Number(p.ifSpeed||0))+"</td><td>"+(p.ifType||"-")+"</td></tr>"}).join("")}
$("search").addEventListener("input",()=>drawRows(demo.ports)); render(demo);
</script>
</body></html>
