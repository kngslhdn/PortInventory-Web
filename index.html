<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch Port Inventory</title>

<style>
:root{
  --bg:#f4f6f8;
  --panel:#fff;
  --nav:#252b33;
  --text:#263238;
  --muted:#68737d;
  --line:#d9dee3;
  --cyan:#53b9d7;
  --green:#35c759;
  --red:#ff4d4f;
  --gray:#9aa1a8;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  font:14px Arial,Helvetica,sans-serif;
  color:var(--text)
}

.top{
  height:62px;
  background:#252b33;
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 22px;
  gap:20px
}

.logo{
  font-size:20px;
  font-weight:700
}

.nav{
  display:flex;
  gap:20px;
  color:#e8edf1;
  font-size:13px
}

.nav span{opacity:.9}

.wrap{
  padding:12px 14px 30px
}

.crumb{
  font-size:14px;
  font-weight:600;
  margin-bottom:10px
}

.toolbar{
  background:#fff;
  border:1px solid #d8dde2;
  border-radius:3px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:12px
}

label{font-weight:600}

.select{
  min-width:390px;
  padding:8px 10px;
  border:1px solid #bbb;
  border-radius:3px;
  background:#fff
}

.banner{
  margin-top:10px;
  background:var(--cyan);
  color:#fff;
  border-radius:4px;
  padding:12px 14px;
  font-weight:700
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
  margin:16px 0
}

.card{
  background:#20252b;
  border:1px solid #394049;
  color:#fff;
  text-align:center;
  padding:10px;
  border-radius:3px
}

.num{
  font-size:22px;
  font-weight:700
}

.lbl{
  font-size:12px;
  margin-top:2px
}

.search{
  width:100%;
  padding:9px 12px;
  border:1px solid #cbd1d6;
  border-radius:3px;
  margin-bottom:0
}

.table-wrap{
  background:#fff;
  border:1px solid #d6dbe0;
  overflow:auto
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px
}

thead{
  background:#2b3138;
  color:#fff
}

th,td{
  text-align:left;
  padding:8px 10px;
  border-bottom:1px solid #e1e5e8
}

th{
  font-weight:600;
  font-size:13px
}

tbody tr:hover{
  background:#f5f9fb
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:4px;
  color:#fff;
  font-size:11px;
  font-weight:700
}

.up{background:var(--green)}
.down{background:var(--red)}
.disabled{background:var(--gray)}
.unknown{background:#8c8c8c}

.footer{
  padding:16px 0;
  color:var(--muted);
  font-size:12px
}

.error{
  background:#fff1f0;
  color:#a8071a;
  border:1px solid #ffa39e;
}

@media(max-width:800px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .select{min-width:0;flex:1}
  .toolbar{flex-wrap:wrap}
}
</style>
</head>

<body>

<header class="top">
  <div class="logo">LibreNMS</div>
  <nav class="nav">
    <span>Overview</span>
    <span>Devices</span>
    <span>Maps</span>
    <span>Ports</span>
    <span>Health</span>
    <span>Wireless</span>
    <span>Services</span>
    <span>Routing</span>
    <span>Alerts</span>
  </nav>
</header>

<main class="wrap">

  <div class="crumb">☰ Switch Port Inventory</div>

  <div class="toolbar">
    <label for="switch">Switch:</label>
    <select id="switch" class="select">
      <option>Loading devices...</option>
    </select>
  </div>

  <div id="banner" class="banner">
    ▤ Loading PortInventory...
  </div>

  <div class="cards">
    <div class="card">
      <div id="total" class="num">0</div>
      <div class="lbl">Total Ports</div>
    </div>

    <div class="card">
      <div id="up" class="num">0</div>
      <div class="lbl">UP</div>
    </div>

    <div class="card">
      <div id="down" class="num">0</div>
      <div class="lbl">DOWN</div>
    </div>

    <div class="card">
      <div id="disabled" class="num">0</div>
      <div class="lbl">Admin Down</div>
    </div>
  </div>

  <input
    id="search"
    class="search"
    placeholder="Search port, description, alias, status..."
  >

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Port</th>
          <th>Status</th>
          <th>Admin</th>
          <th>Description</th>
          <th>Alias</th>
          <th>Speed</th>
          <th>Type</th>
        </tr>
      </thead>

      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="footer">
    PortInventory Web • Data source: LibreNMS NMS • Web presentation via GitHub Pages
  </div>

</main>

<script>

const $ = id => document.getElementById(id);

let inventory = null;
let currentDevice = null;

function speed(v){

  v = Number(v || 0);

  if(v >= 1000000000){
    return (v / 1000000000).toLocaleString() + " Gbps";
  }

  if(v >= 1000000){
    return Math.round(v / 1000000) + " Mbps";
  }

  if(v >= 1000){
    return Math.round(v / 1000) + " Kbps";
  }

  return v ? v + " bps" : "-";
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getDeviceFromUrl(){

  const params = new URLSearchParams(window.location.search);
  const id = Number(params.get("device"));

  if(id > 0 && inventory?.devices){
    return inventory.devices.find(
      d => Number(d.device_id) === id
    );
  }

  return null;
}

function updateUrl(deviceId){

  const url = new URL(window.location.href);

  url.searchParams.set("device", deviceId);

  window.history.replaceState(
    {},
    "",
    url.toString()
  );
}

function populateDevices(){

  const select = $("switch");

  select.innerHTML = "";

  inventory.devices.forEach(device => {

    const option = document.createElement("option");

    option.value = device.device_id;

    option.textContent =
      (device.sysName || device.hostname || "Unknown") +
      " (" +
      (device.hostname || "-") +
      ")";

    select.appendChild(option);

  });
}

function selectDevice(deviceId){

  const device = inventory.devices.find(
    d => Number(d.device_id) === Number(deviceId)
  );

  if(!device){
    return;
  }

  currentDevice = device;

  $("switch").value = String(device.device_id);

  updateUrl(device.device_id);

  renderDevice(device);
}

function renderDevice(device){

  const ports = Array.isArray(device.ports)
    ? device.ports
    : [];

  const hostname = device.hostname || "";

  $("banner").textContent =
    "▤ " +
    (device.sysName || hostname || "Switch Port Inventory") +
    (hostname ? " — " + hostname : "");

  $("total").textContent = ports.length;

  $("up").textContent =
    ports.filter(
      p => String(p.ifOperStatus).toLowerCase() === "up"
    ).length;

  $("down").textContent =
    ports.filter(
      p => String(p.ifOperStatus).toLowerCase() === "down"
    ).length;

  $("disabled").textContent =
    ports.filter(
      p => String(p.ifAdminStatus).toLowerCase() === "down"
    ).length;

  drawRows(ports);
}

function drawRows(ports){

  const q = $("search").value.toLowerCase();

  const filtered = ports.filter(port =>
    Object.values(port)
      .join(" ")
      .toLowerCase()
      .includes(q)
  );

  $("rows").innerHTML = filtered.map(p => {

    const status =
      String(p.ifOperStatus || "").toLowerCase();

    const admin =
      String(p.ifAdminStatus || "").toLowerCase();

    const statusClass =
      status === "up"
        ? "up"
        : status === "down"
          ? "down"
          : "unknown";

    const adminClass =
      admin === "up"
        ? "up"
        : admin === "down"
          ? "disabled"
          : "unknown";

    return `
      <tr>
        <td>${escapeHtml(p.ifName || "-")}</td>

        <td>
          <span class="badge ${statusClass}">
            ${escapeHtml(status.toUpperCase() || "-")}
          </span>
        </td>

        <td>
          <span class="badge ${adminClass}">
            ${escapeHtml(admin.toUpperCase() || "-")}
          </span>
        </td>

        <td>${escapeHtml(p.ifDescr || "-")}</td>

        <td>${escapeHtml(p.ifAlias || "-")}</td>

        <td>${escapeHtml(speed(p.ifSpeed))}</td>

        <td>${escapeHtml(p.ifType || "-")}</td>
      </tr>
    `;

  }).join("");

}

async function loadInventory(){

  try{

    $("banner").textContent =
      "▤ Loading PortInventory data...";

    const response =
      await fetch(
        "data/devices.json?v=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "HTTP " + response.status
      );
    }

    const catalog = await response.json();

    if(
      !catalog ||
      !Array.isArray(catalog.devices)
    ){
      throw new Error(
        "Invalid PortInventory catalog"
      );
    }

    inventory = {
      ...catalog,
      devices: catalog.devices
    };

    populateDevices();

    const urlDevice =
      getDeviceFromUrl();

    const selectedMeta =
      urlDevice ||
      inventory.devices[0];

    if(selectedMeta){

      $("switch").value =
        String(selectedMeta.device_id);

      updateUrl(selectedMeta.device_id);

      const deviceResponse =
        await fetch(
          "data/devices/" +
          encodeURIComponent(selectedMeta.device_id) +
          ".json?v=" +
          Date.now(),
          {
            cache:"no-store"
          }
        );

      if(!deviceResponse.ok){
        throw new Error(
          "HTTP " + deviceResponse.status +
          " while loading device " +
          selectedMeta.device_id
        );
      }

      const selected =
        await deviceResponse.json();

      currentDevice = selected;

      renderDevice(selected);

    }else{

      $("banner").textContent =
        "▤ No devices found";

    }

  }catch(error){

    console.error(error);

    $("banner").classList.add("error");

    $("banner").textContent =
      "▤ Unable to load PortInventory data: " +
      error.message;

    $("switch").innerHTML =
      "<option>Data unavailable</option>";

  }

}

$("switch").addEventListener(
  "change",
  event => {
    selectDevice(event.target.value);
  }
);

$("search").addEventListener(
  "input",
  () => {

    if(currentDevice){

      drawRows(
        Array.isArray(currentDevice.ports)
          ? currentDevice.ports
          : []
      );

    }

  }
);

loadInventory();

</script>

</body>
</html>
